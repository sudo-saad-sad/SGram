name: Build SGram Matrix APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        cache: 'gradle'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Ensure API_KEYS File Exists
      run: |
        echo "APP_ID=12345" > TMessagesProj/API_KEYS
        echo "APP_HASH=0123456789abcdef0123456789abcdef" >> TMessagesProj/API_KEYS
        echo "APP_ID=12345" > API_KEYS
        echo "APP_HASH=0123456789abcdef0123456789abcdef" >> API_KEYS

    - name: Extract Prebuilt Native Libraries
      run: |
        mkdir -p temp_lib
        curl -sL https://github.com/Telegram-FOSS-Team/Telegram-FOSS/releases/download/v10.14.3/TF-BETA-THERMATK-v10.14.3.apk -o temp_lib/tf.apk
        unzip -q temp_lib/tf.apk "lib/*" -d temp_lib
        mkdir -p TMessagesProj/src/main/jniLibs
        mv temp_lib/lib/* TMessagesProj/src/main/jniLibs/
        rm -rf temp_lib

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew :TMessagesProj_App:assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: SGram-Matrix-Debug-APK
        path: TMessagesProj_App/build/outputs/apk/**/*.apk

    - name: Publish to GitHub Releases
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        APK_FILE=$(find TMessagesProj_App/build/outputs/apk/ -name "*.apk" | head -n 1)
        if [ -n "$APK_FILE" ]; then
          echo "Found APK at $APK_FILE"
          gh release upload v0.3.1 "$APK_FILE#SGram-Matrix-debug.apk" --clobber || true
        fi
